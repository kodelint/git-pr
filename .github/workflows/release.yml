name: Release

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'  # Run on version tags like v1.2.3

jobs:
  # Skip CI check for semantic release (similar to your first workflow)
  skip-ci-check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Determine if CI should be skipped
        id: skip_check
        run: |
          # RULE 1: NEVER SKIP CI FOR TAGS
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "🏷️  TAG DETECTED - NEVER SKIPPING CI FOR RELEASES"
            echo "should_skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # RULE 2: For non-tag events, check skip patterns
          COMMIT_MSG="${{ github.event.head_commit.message || '' }}"
          should_skip=false
          
          # Check for skip patterns in current commit only
          if [[ "$COMMIT_MSG" == *"[skip ci]"* ]] || 
             [[ "$COMMIT_MSG" == *"[ci skip]"* ]] || 
             [[ "$COMMIT_MSG" == *"[skip actions]"* ]] || 
             [[ "$COMMIT_MSG" == *"[actions skip]"* ]]; then
            should_skip=true
          fi
          
          echo "should_skip=$should_skip" >> $GITHUB_OUTPUT

  # Semantic Release for version management
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: skip-ci-check
    if: |
      needs.skip-ci-check.outputs.should_skip == 'false' &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN }}

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install semantic-release Rust plugin
        run: cargo install semantic-release-rust

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Semantic Release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
          # Configure for pre-releases on develop branch
          BRANCH: ${{ github.ref == 'refs/heads/develop' && '--preRelease' || '' }}
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "🚀 Creating pre-release from develop branch"
            semantic-release --no-ci --preRelease
          else
            echo "🚀 Creating stable release from main branch"
            semantic-release --no-ci
          fi
          
          # Capture the new version if created
          if [ -f "VERSION" ]; then
            NEW_VERSION=$(cat VERSION)
            echo "new-release-published=true" >> $GITHUB_OUTPUT
            echo "new-release-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "new-release-published=false" >> $GITHUB_OUTPUT
            echo "new-release-version=" >> $GITHUB_OUTPUT
          fi

  # Build for multiple platforms
  build:
    runs-on: ${{ matrix.os }}
    needs:
      - skip-ci-check
      - semantic-release
    if: |
      needs.skip-ci-check.outputs.should_skip == 'false' &&
      (needs.semantic-release.outputs.new-release-published == 'true' || github.ref_type == 'tag')
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        arch: [x86_64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Install updates (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y pkg-config build-essential

      - name: Build release binary
        run: cargo build --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: git-pr-${{ matrix.os }}-${{ matrix.arch }}
          path: target/release/git-pr

  # Create GitHub release with binaries
  release:
    needs:
      - semantic-release
      - build
    runs-on: ubuntu-latest
    if: needs.semantic-release.outputs.new-release-published == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: git-pr-ubuntu-latest-x86_64
          path: ./artifact/linux-x86_64

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: git-pr-macos-latest-x86_64
          path: ./artifact/macos-x86_64

      - name: Determine release type
        id: release-type
        run: |
          if [ "${{ github.ref }}" == "refs/heads/develop" ]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.semantic-release.outputs.new-release-version || github.ref_name }}
          name: Release ${{ needs.semantic-release.outputs.new-release-version || github.ref_name }}
          draft: false
          prerelease: ${{ steps.release-type.outputs.IS_PRERELEASE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Upload Linux binary to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifact/linux-x86_64/git-pr
          asset_name: git-pr-linux-x86_64
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      - name: Upload macOS binary to release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifact/macos-x86_64/git-pr
          asset_name: git-pr-macos-x86_64
          asset_content_type: application/octet-stream
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}